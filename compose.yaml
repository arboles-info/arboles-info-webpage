services:
  db:
    image: postgis/postgis:16-3.4
    container_name: arboles-info-db
    environment:
      POSTGRES_DB: arboles_info
      POSTGRES_USER: arboles_user
      POSTGRES_PASSWORD: arboles_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arboles_user -d arboles_info"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - arboles-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arboles-info-web
    command: >
      sh -c "
        python manage.py migrate --noinput &&
        exec gunicorn arboles_info_project.wsgi:application --bind 0.0.0.0:8080 --workers 2 --threads 2 --timeout 120 --access-logfile - --error-logfile -
      "
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: arboles_info
      DB_USER: arboles_user
      DB_PASSWORD: arboles_password
      SECRET_KEY: ${SECRET_KEY:-django-insecure-change-me-in-production}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      PORT: 8080
    volumes:
      - staticfiles:/app/staticfiles
    ports:
      - "8000:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - arboles-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/')"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

volumes:
  postgres_data:
    driver: local
  staticfiles:
    driver: local

networks:
  arboles-network:
    driver: bridge

